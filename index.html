
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffeef5);
      overflow: hidden;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 450px;
      padding: 40px 25px;
      text-align: center;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .heart {
      font-size: 60px;
      animation: heartbeat 1.2s infinite;
    }

    h1 {
      color: #ff4f81;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
      line-height: 1.5;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      border: none;
      padding: 13px 28px;
      font-size: 17px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #ff4f81;
      color: white;
    }

    #yes:hover {
      transform: scale(1.1);
      background: #ff2f6d;
    }

    #no {
      background: #ddd;
      color: #333;
      position: relative;
    }

    .success {
      display: none;
    }

    .success h2 {
      color: #ff4f81;
      font-size: 30px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    .floating-heart {
      position: absolute;
      bottom: -30px;
      font-size: 25px;
      animation: floatUp 5s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 0;
      }

      20% {
        opacity: 0.7;
      }

      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div id="invitation">

      <div class="heart">💌</div>

      <h1>SUP</h1>

      <p>
        Hey! bro I have question for you... 🥰
      </p>

      <p>
        are you gay? 🌈
      </p>

      <div class="buttons">
        <button id="yes" onclick="sayYes()">YES 💗</button>
        <button id="no" onmouseover="moveNo()">NO 😭</button>
      </div>

    </div>

    <div id="success" class="success">

      <div class="heart">💖</div>

      <h2>YAY!!! 🥰</h2>

      <p>
        I knew you'd say gay! 😌
      </p>

      <p>
        bwhahahahah 🌹✨
      </p>

    </div>

  </div>

  <script>

    const noButton = document.getElementById("no");

    function moveNo() {

      // Make the button move around the screen
      const maxX = window.innerWidth - noButton.offsetWidth - 20;
      const maxY = window.innerHeight - noButton.offsetHeight - 20;

      const randomX = Math.max(10, Math.random() * maxX);
      const randomY = Math.max(10, Math.random() * maxY);

      noButton.style.position = "fixed";
      noButton.style.left = randomX + "px";
      noButton.style.top = randomY + "px";
    }

    function sayYes() {

      document.getElementById("invitation").style.display = "none";
      document.getElementById("success").style.display = "block";

      createHearts();
    }

    function createHearts() {

      for (let i = 0; i < 25; i++) {

        const heart = document.createElement("div");

        heart.className = "floating-happy";
        heart.innerHTML = "😌";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDelay = Math.random() * 3 + "s";
        heart.style.fontSize = (15 + Math.random() * 25) + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);
      }
    }

  </script>

</body>
</html>
