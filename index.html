<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Ball Newspaper</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:url("dragon/c1d2c5a2-8692-42b0-98f3-91fda723c0c4.jpg") no-repeat center center fixed;
    background-size:cover;
    height:90vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.35);
}

.menu{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:850px;
    max-height:80vh;
    overflow-y:auto;
    padding:40px;
    background:#f5ecd7;
    border:8px solid #6b4b2a;
    border-radius:10px;
    box-shadow:0 0 25px rgba(0,0,0,.6);
    color:#222;
}

.logo{
    font-family:"Times New Roman", serif;
    font-size:50px;
    font-weight:bold;
    text-align:center;
    border-bottom:4px solid black;
    padding-bottom:15px;
    margin-bottom:20px;
}

.subtitle{
    text-align:center;
    font-family:Georgia, serif;
    font-size:20px;
    font-style:italic;
    margin-bottom:25px;
}

.article{
    font-family:Georgia, serif;
    font-size:18px;
    line-height:1.8;
    text-align:justify;
    column-count:2;
    column-gap:40px;
}

.article h2{
    column-span:all;
    text-align:center;
    margin-bottom:15px;
}

.continue-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:15px 30px;
    font-size:20px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    background:#ff9800;
    color:white;
    cursor:pointer;
}

.continue-btn:hover{
    background:#ffb74d;
}
</style>

</head>
<body>

<div class="menu">

<div class="logo">
THE SERVER IS DOWN
</div>

<div class="subtitle">
SERVER DOWN!!!!!!!!!!!!!</div>

<div class="article">
<div style="text-align:center;">Apologize for inconvenience. thank you</div> 
</div>
<div class="article">
<div style="text-align:center;">We provide the link to send an issue to one our admin</div> 
</div>

<div style="text-align:center;">
    <a href="https://www.instagram.com/zues_solitude/" target="_blank">Follow the one our admin</a>
</div>

</body>
</html>
