<!DOCTYPE html>
<html>
<head>
    <title>Love Battle</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            background: #080812;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* =========================
           TITLE
        ========================= */

        h1 {
            text-align: center;
            margin-top: 25px;
            color: #ff65ae;
            font-size: 34px;
        }

        /* =========================
           ARENA - PC
        ========================= */

        .arena {
            position: absolute;

            width: 80%;
            max-width: 850px;
            height: 400px;

            left: 50%;
            top: 52%;

            transform: translate(-50%, -50%);

            border: 4px solid #ff65ae;
            border-radius: 15px;

            background: linear-gradient(
                #171727,
                #0b0b14
            );

            box-shadow: 0 0 30px #ff65ae55;

            overflow: hidden;
        }

        /* =========================
           FLOOR
        ========================= */

        .floor {
            position: absolute;

            bottom: 55px;
            left: 5%;

            width: 90%;
            height: 3px;

            background: #ff65ae;
            box-shadow: 0 0 10px #ff65ae;
        }

        /* =========================
           HP
        ========================= */

        .hp {
            position: absolute;

            top: 20px;

            width: 180px;
            height: 18px;

            border: 2px solid white;
            border-radius: 10px;

            overflow: hidden;
        }

        .hpbar {
            height: 100%;
            width: 100%;

            transition: width 0.3s;
        }

        #heroHPBox {
            left: 25px;
        }

        #enemyHPBox {
            right: 25px;
        }

        #heroHP {
            background: #45eaff;
        }

        #enemyHP {
            background: #ff4b6e;
        }

        /* =========================
           LABELS
        ========================= */

        .label {
            position: absolute;

            top: 42px;

            font-size: 13px;
        }

        #heroLabel {
            left: 25px;
        }

        #enemyLabel {
            right: 25px;
        }

        /* =========================
           STICKMAN
        ========================= */

        .stickman {
            position: absolute;

            width: 70px;
            height: 150px;

            bottom: 58px;
        }

        #hero {
            left: 13%;
        }

        #enemy {
            right: 13%;
        }

        .head {
            position: absolute;

            width: 38px;
            height: 38px;

            border: 4px solid white;
            border-radius: 50%;

            left: 16px;
            top: 0;
        }

        .body {
            position: absolute;

            width: 4px;
            height: 65px;

            background: white;

            left: 34px;
            top: 38px;
        }

        .arm {
            position: absolute;

            width: 48px;
            height: 4px;

            background: white;

            top: 55px;

            transform-origin: left center;
        }

        .leftArm {
            left: 34px;
            transform: rotate(145deg);
        }

        .rightArm {
            left: 34px;
            transform: rotate(35deg);
        }

        .leg {
            position: absolute;

            width: 52px;
            height: 4px;

            background: white;

            top: 100px;

            transform-origin: left center;
        }

        .leftLeg {
            left: 34px;
            transform: rotate(120deg);
        }

        .rightLeg {
            left: 34px;
            transform: rotate(60deg);
        }

        /* ENEMY MIRROR */

        #enemy .leftArm,
        #enemy .rightArm,
        #enemy .leftLeg,
        #enemy .rightLeg {
            transform-origin: right center;
        }

        #enemy .leftArm {
            transform: rotate(35deg);
        }

        #enemy .rightArm {
            transform: rotate(145deg);
        }

        #enemy .leftLeg {
            transform: rotate(60deg);
        }

        #enemy .rightLeg {
            transform: rotate(120deg);
        }

        /* =========================
           FIGHTING
        ========================= */

        .fighting .leftArm {
            animation: leftPunch 0.35s infinite alternate;
        }

        .fighting .rightArm {
            animation: rightPunch 0.35s infinite alternate;
        }

        .fighting .leftLeg {
            animation: leftKick 0.5s infinite alternate;
        }

        .fighting .rightLeg {
            animation: rightKick 0.5s infinite alternate;
        }

        @keyframes leftPunch {
            from {
                transform: rotate(145deg);
            }

            to {
                transform: rotate(90deg);
            }
        }

        @keyframes rightPunch {
            from {
                transform: rotate(35deg);
            }

            to {
                transform: rotate(5deg);
            }
        }

        @keyframes leftKick {
            from {
                transform: rotate(120deg);
            }

            to {
                transform: rotate(145deg);
            }
        }

        @keyframes rightKick {
            from {
                transform: rotate(60deg);
            }

            to {
                transform: rotate(35deg);
            }
        }

        /* =========================
           ATTACK
        ========================= */

        .attack {
            animation: attack 0.3s ease;
        }

        @keyframes attack {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(35px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .enemyAttack {
            animation: enemyAttack 0.3s ease;
        }

        @keyframes enemyAttack {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-35px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* =========================
           HIT
        ========================= */

        .hit {
            animation: hit 0.25s;
        }

        @keyframes hit {
            0%, 100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(4);
            }
        }

        /* =========================
           DEATH
        ========================= */

        .dead {
            animation: fall 1.5s forwards;
        }

        @keyframes fall {
            0% {
                transform: rotate(0deg) translateY(0);
            }

            100% {
                transform: rotate(90deg) translateY(65px);
                opacity: 0.2;
            }
        }

        /* =========================
           CENTER MESSAGE
        ========================= */

        #message {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 80%;
            max-width: 600px;

            text-align: center;

            color: #ffb3d7;

            font-size: 19px;
            font-weight: bold;

            line-height: 1.6;

            background: rgba(8, 8, 18, 0.96);

            padding: 25px 30px;

            border: 2px solid #ff65ae;
            border-radius: 15px;

            box-shadow:
                0 0 15px #ff65ae,
                inset 0 0 20px #ff65ae22;

            opacity: 0;
            visibility: hidden;

            z-index: 20;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        #message.show {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
           MESSAGE TEXT
        ========================= */

        #messageText {
            min-height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            animation: textAppear 0.7s ease;
        }

        #messageText.change {
            animation: textChange 0.6s ease;
        }

        @keyframes textAppear {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes textChange {
            0% {
                opacity: 0;
                transform: translateY(25px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           NEXT BUTTON
        ========================= */

        #nextButton {
            margin-top: 18px;

            padding: 10px 28px;

            border: 2px solid #ff65ae;
            border-radius: 25px;

            background: #ff65ae;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 15px #ff65ae88;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        #nextButton:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 25px #ff65ae,
                0 0 40px #ff65ae55;
        }

        #nextButton:active {
            transform: scale(0.95);
        }

        /* =====================================================
           📱 MOBILE PHONE
           ===================================================== */

        @media screen and (max-width: 600px) {

            h1 {
                margin-top: 12px;
                font-size: 24px;
            }

            .arena {
                width: calc(100% - 16px);

                height: 72vh;

                min-height: 420px;
                max-height: 650px;

                top: 53%;

                border-width: 3px;
                border-radius: 12px;
            }

            /* MOBILE HP */

            .hp {
                top: 14px;

                width: 35%;

                height: 16px;
            }

            #heroHPBox {
                left: 14px;
            }

            #enemyHPBox {
                right: 14px;
            }

            /* MOBILE LABEL */

            .label {
                top: 35px;
                font-size: 10px;
            }

            #heroLabel {
                left: 14px;
            }

            #enemyLabel {
                right: 14px;
            }

            /* MOBILE CHARACTERS */

            .stickman {
                bottom: 68px;

                transform: scale(0.80);
            }

            #hero {
                left: 5%;
            }

            #enemy {
                right: 5%;
            }

            /* MOBILE FLOOR */

            .floor {
                bottom: 62px;
            }

            /* MOBILE MESSAGE */

            #message {
                width: 88%;

                max-width: none;

                padding: 20px 14px;

                font-size: 16px;

                line-height: 1.5;

                border-radius: 13px;
            }

            #messageText {
                min-height: 75px;

                padding: 0 5px;
            }

            /* MOBILE BUTTON */

            #nextButton {
                margin-top: 14px;

                min-width: 125px;

                padding: 11px 25px;

                font-size: 14px;

                touch-action: manipulation;
            }
        }

        /* =====================================================
           📱 SMALL PHONE
           ===================================================== */

        @media screen and (max-width: 400px) {

            h1 {
                font-size: 21px;
                margin-top: 10px;
            }

            .arena {
                width: calc(100% - 10px);

                height: 73vh;

                min-height: 390px;
            }

            .hp {
                width: 34%;
                height: 15px;
            }

            .label {
                font-size: 9px;
            }

            .stickman {
                transform: scale(0.70);
            }

            #hero {
                left: 2%;
            }

            #enemy {
                right: 2%;
            }

            #message {
                width: 92%;

                padding: 18px 12px;

                font-size: 15px;

                line-height: 1.45;
            }

            #messageText {
                min-height: 70px;
            }

            #nextButton {
                min-width: 115px;

                padding: 10px 22px;

                font-size: 13px;
            }
        }

        /* =====================================================
           📱 VERY SMALL PHONE
           ===================================================== */

        @media screen and (max-width: 350px) {

            h1 {
                font-size: 19px;
            }

            .arena {
                height: 70vh;
                min-height: 360px;
            }

            .stickman {
                transform: scale(0.60);
            }

            #message {
                width: 94%;

                padding: 16px 10px;

                font-size: 14px;
            }

            #messageText {
                min-height: 65px;
            }

            #nextButton {
                min-width: 105px;

                padding: 9px 18px;
            }
        }

        /* =====================================================
           📱 MOBILE LANDSCAPE
           ===================================================== */

        @media screen and (max-width: 900px)
               and (orientation: landscape) {

            h1 {
                margin-top: 4px;
                font-size: 20px;
            }

            .arena {
                width: 92%;

                height: 82vh;

                min-height: 280px;

                top: 54%;
            }

            .stickman {
                bottom: 35px;

                transform: scale(0.65);
            }

            .floor {
                bottom: 32px;
            }

            #message {
                width: 75%;

                padding: 12px 18px;

                font-size: 14px;
            }

            #messageText {
                min-height: 45px;
            }

            #nextButton {
                margin-top: 7px;

                padding: 7px 22px;
            }
        }

    </style>
</head>

<body>

    <h1>Man vs. self</h1>

    <div class="arena">

        <!-- HERO HP -->
        <div id="heroHPBox" class="hp">
            <div id="heroHP" class="hpbar"></div>
        </div>

        <!-- ENEMY HP -->
        <div id="enemyHPBox" class="hp">
            <div id="enemyHP" class="hpbar"></div>
        </div>

        <!-- LABELS -->
        <div id="heroLabel" class="label">
            CALI
        </div>

        <div id="enemyLabel" class="label">
            FUTURE 💔
        </div>

        <!-- HERO -->
        <div id="hero" class="stickman fighting">

            <div class="head"></div>
            <div class="body"></div>

            <div class="arm leftArm"></div>
            <div class="arm rightArm"></div>

            <div class="leg leftLeg"></div>
            <div class="leg rightLeg"></div>

        </div>

        <!-- ENEMY -->
        <div id="enemy" class="stickman fighting">

            <div class="head"></div>
            <div class="body"></div>

            <div class="arm leftArm"></div>
            <div class="arm rightArm"></div>

            <div class="leg leftLeg"></div>
            <div class="leg rightLeg"></div>

        </div>

        <!-- FLOOR -->
        <div class="floor"></div>

        <!-- CENTER MESSAGE -->
        <div id="message">

            <div id="messageText">
                I gave everything I had...
            </div>

            <button id="nextButton">
                Next
            </button>

        </div>

    </div>


    <script>

        /* =========================
           GAME VARIABLES
        ========================= */

        let heroHP = 100;
        let enemyHP = 100;

        let battleOver = false;
        let turn = 0;


        const hero = document.getElementById("hero");
        const enemy = document.getElementById("enemy");

        const heroBar = document.getElementById("heroHP");
        const enemyBar = document.getElementById("enemyHP");

        const message = document.getElementById("message");
        const messageText = document.getElementById("messageText");
        const nextButton = document.getElementById("nextButton");


        /* =========================
           MESSAGE SENTENCES
        ========================= */

        const messages = [

            "I gave everything I had...",

            "I fought until the very end.",

            "BUT...",

            "I, cali ready to delve."

        ];


        let messageIndex = 0;


        /* =========================
           HERO ATTACK
        ========================= */

        function heroAttack() {

            if (battleOver) return;

            hero.classList.add("attack");
            enemy.classList.add("hit");

            setTimeout(function () {

                hero.classList.remove("attack");
                enemy.classList.remove("hit");

            }, 300);


            enemyHP -= 8;

            if (enemyHP < 0) {
                enemyHP = 0;
            }

            enemyBar.style.width = enemyHP + "%";


            if (enemyHP <= 0) {
                enemyDies();
            }
        }


        /* =========================
           ENEMY ATTACK
        ========================= */

        function enemyAttack() {

            if (battleOver) return;

            enemy.classList.add("enemyAttack");
            hero.classList.add("hit");

            setTimeout(function () {

                enemy.classList.remove("enemyAttack");
                hero.classList.remove("hit");

            }, 300);


            heroHP -= 20;

            if (heroHP < 0) {
                heroHP = 0;
            }

            heroBar.style.width = heroHP + "%";


            if (heroHP <= 0) {
                heroDies();
            }
        }


        /* =========================
           HERO DIES
        ========================= */

        function heroDies() {

            if (battleOver) return;

            battleOver = true;

            hero.classList.remove("fighting");
            hero.classList.add("dead");


            setTimeout(function () {

                message.classList.add("show");

                messageIndex = 0;

                messageText.textContent =
                    messages[messageIndex];

                nextButton.textContent = "Next";

            }, 800);
        }


        /* =========================
           ENEMY DIES
        ========================= */

        function enemyDies() {

            if (battleOver) return;

            battleOver = true;

            enemy.classList.remove("fighting");
            enemy.classList.add("dead");
        }


        /* =========================
           NEXT ATTACK
        ========================= */

        function nextAttack() {

            if (battleOver) return;

            turn++;


            if (turn % 2 === 1) {

                heroAttack();

            } else {

                enemyAttack();

            }


            if (!battleOver) {

                setTimeout(nextAttack, 650);

            }
        }


        /* =========================
           NEXT MESSAGE
        ========================= */

        nextButton.addEventListener("click", function () {

            if (messageIndex < messages.length - 1) {

                messageIndex++;


                /* Restart animation */

                messageText.classList.remove("change");

                void messageText.offsetWidth;

                messageText.classList.add("change");


                /* Change sentence */

                messageText.textContent =
                    messages[messageIndex];


                /* Last sentence */

                if (messageIndex === messages.length - 1) {

                    nextButton.textContent = "Continue";

                }

            } else {

                /* Close message */

                message.classList.remove("show");

            }

        });


        /* =========================
           START BATTLE
        ========================= */

        setTimeout(nextAttack, 1200);

    </script>

</body>
</html>
