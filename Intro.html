<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to 3rd Earth</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  color: white;
  background: #010711;
  overflow-x: hidden;
}

/* SPACE */
.space {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at center, #063957, #020914 55%, #000 100%);
  z-index: -2;
}

.space::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(#5edfff 1px, transparent 1px);
  background-size: 80px 80px, 140px 140px;
  opacity: .45;
}

/* EARTH */
.earth {
  position: fixed;
  width: 800px;
  height: 800px;
  border-radius: 50%;
  left: 50%;
  top: 60%;
  transform: translate(-50%, -50%);

  background:
    radial-gradient(circle at 35% 30%,
      #61eaff,
      #087dbd 25%,
      #063c64 50%,
      #010c18 75%,
      #000 100%);

  box-shadow:
    0 0 40px #00d9ff,
    0 0 100px #0077ff,
    inset -100px -50px 120px #000;

  animation: rotate 40s linear infinite;
}

/* CONTINENTS */
.land {
  position: absolute;
  background: #32d879;
  filter: drop-shadow(0 0 8px #00ff88);
  opacity: .85;
}

.land.one {
  width: 250px;
  height: 140px;
  left: 130px;
  top: 150px;
  border-radius: 60% 30% 70% 40%;
  transform: rotate(-20deg);
}

.land.two {
  width: 190px;
  height: 270px;
  left: 410px;
  top: 280px;
  border-radius: 40% 70% 35% 60%;
  transform: rotate(20deg);
}

.land.three {
  width: 150px;
  height: 90px;
  left: 160px;
  top: 500px;
  border-radius: 50% 70% 30% 60%;
}

/* ATMOSPHERE */
.atmosphere {
  position: fixed;
  width: 840px;
  height: 840px;
  border-radius: 50%;
  left: 50%;
  top: 60%;
  transform: translate(-50%, -50%);
  border: 3px solid rgba(0, 220, 255, .5);
  box-shadow: 0 0 50px #00cfff;
  animation: pulse 4s infinite;
}

/* WELCOME SCREEN */
.welcome-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}

.content {
  max-width: 700px;
  z-index: 5;
}

.logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 25px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 40px;

  background: radial-gradient(circle, #4deaff, #007bb5, #02304e);
  box-shadow:
    0 0 25px #00d9ff,
    0 0 60px rgba(0, 180, 255, .6);
}

h1 {
  font-size: clamp(45px, 8vw, 85px);
  letter-spacing: 8px;
  text-transform: uppercase;
  text-shadow: 0 0 30px #00d9ff;
}

.subtitle {
  margin-top: 15px;
  font-size: 19px;
  color: #8eeaff;
  letter-spacing: 3px;
}

.description {
  margin: 25px auto;
  max-width: 550px;
  line-height: 1.7;
  color: #d4edf5;
  font-size: 16px;
}

/* BUTTON */
.get-started {
  margin-top: 20px;
  padding: 16px 38px;

  border: none;
  border-radius: 30px;

  background: white;
  color: #05658f;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  box-shadow: 0 0 25px rgba(0, 220, 255, .5);

  transition: .25s;
}

.get-started:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 0 40px #00d9ff;
}

/* SIGN UP SCREEN */
.signup-screen {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.card {
  width: 440px;
  max-width: 100%;
  background: rgba(255,255,255,.97);
  color: #202124;
  padding: 40px;
  border-radius: 25px;
  box-shadow: 0 20px 80px rgba(0,0,0,.6);
}

.card h2 {
  text-align: center;
  font-size: 28px;
  font-weight: 400;
  margin-bottom: 8px;
}

.card p {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.input {
  margin-bottom: 16px;
}

.input label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
}

.input input {
  width: 100%;
  height: 50px;
  padding: 0 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

.input input:focus {
  border: 2px solid #0788c5;
}

.create {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 25px;
  background: #087eb9;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  margin-top: 8px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 18px;
  color: #087eb9;
  text-decoration: none;
  font-size: 14px;
}

/* FOOTER */
footer {
  position: fixed;
  bottom: 15px;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255,255,255,.6);
  font-size: 12px;
}

/* ANIMATIONS */
@keyframes rotate {
  from {
    transform: translate(-50%, -50%) rotate(0);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

@keyframes pulse {
  0%,100% {
    opacity: .5;
    transform: translate(-50%, -50%) scale(1);
  }

  50% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.03);
  }
}

/* MOBILE */
@media(max-width:600px) {
  .earth {
    width: 500px;
    height: 500px;
  }

  .atmosphere {
    width: 530px;
    height: 530px;
  }

  .card {
    padding: 30px 22px;
  }
}
</style>
</head>

<body>

<div class="space"></div>

<div class="atmosphere"></div>

<div class="earth">
  <div class="land one"></div>
  <div class="land two"></div>
  <div class="land three"></div>
</div>


<!-- WELCOME PAGE -->
<section class="welcome-screen" id="welcome">

  <div class="content">

    <div class="logo">🌍</div>

    <h1>3rd Earth</h1>

    <div class="subtitle">
      A NEW WORLD BEGINS HERE
    </div>

    <p class="description">
      Welcome to your WORLD — a new digital world built for exploration,
      connection, creativity, and the future.
    </p>

    <button class="get-started" onclick="showSignup()">
      Get Started →
    </button>

  </div>

</section>


<!-- SIGN UP PAGE -->
<section class="signup-screen" id="signup">

  <div class="card">

    <h2>Create your account</h2>

    <p>Join the 3rd Earth community</p>

    <form onsubmit="createAccount(event)">

      <div class="input">
        <label>Full name</label>
        <input
          type="text"
          placeholder="Enter your name"
          required>
      </div>

      <div class="input">
        <label>Email</label>
        <input
          type="email"
          placeholder="Enter your email"
          required>
      </div>

      <div class="input">
        <label>Password</label>
        <input
          type="password"
          placeholder="Create a password"
          required>
      </div>

      <button class="create" type="submit">
        Create account
      </button>

    </form>

    <a href="#" class="back" onclick="showWelcome(event)">
      ← Back to welcome
    </a>

  </div>

</section>


<footer>
  © 2026 3rd Earth · Explore the future
</footer>


<script>

function showSignup() {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("signup").style.display = "flex";
}

function showWelcome(event) {
  event.preventDefault();

  document.getElementById("signup").style.display = "none";
  document.getElementById("welcome").style.display = "flex";
}

function createAccount(event) {
  event.preventDefault();

  alert(
    "Welcome to World! 🌍\n\n" +
    "Your account creation is currently a demo."
  );
}

</script>

</body>
</html>
```
